name: 'Datagaps DataOps Suite Trigger'
description: 'Trigger Datagaps objects by ID and show a summary table.'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  base-url:
    description: 'Datagaps DataOps Suite URL'
    required: true
  token:
    description: 'Datagaps API token'
    required: true
  dataflow-ids:
    description: 'Dataflow IDs (comma-separated)'
    required: false
    default: ''
  pipeline-ids:
    description: 'Pipeline IDs (comma-separated)'
    required: false
    default: ''
  dbflow-ids:
    description: 'DB flow IDs (comma-separated)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"
    - shell: bash
      env:
        DG_BASE_URL: ${{ inputs.base-url }}
        DG_TOKEN: ${{ inputs.token }}
        DG_DATAFLOW_IDS: ${{ inputs.dataflow-ids }}
        DG_PIPELINE_IDS: ${{ inputs.pipeline-ids }}
        DG_DBFLOW_IDS: ${{ inputs.dbflow-ids }}
      run: python "${{ github.action_path }}/trigger_objects.py"
