name: 'Datagaps DataOps Suite Trigger'
description: 'Trigger DataOps Suite objects for changed JSON files and wait for the result'
author: 'Datagaps'
branding:
  icon: 'play-circle'
  color: 'blue'

inputs:
  client-id:
    description: 'DataOps OAuth client ID'
    required: true
  client-secret:
    description: 'DataOps OAuth client secret'
    required: true
  username:
    description: 'DataOps username'
    required: true
  password:
    description: 'DataOps password'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash
    - run: python ${{ github.action_path }}/trigger_dataflow.py
      shell: bash
      env:
        DATAOPS_CLIENT_ID: ${{ inputs.client-id }}
        DATAOPS_CLIENT_SECRET: ${{ inputs.client-secret }}
        DATAOPS_USERNAME: ${{ inputs.username }}
        DATAOPS_PASSWORD: ${{ inputs.password }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
